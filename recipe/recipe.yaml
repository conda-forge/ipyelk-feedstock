# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.0"
  python_check_max: "3.15"
  jupyterlab_min: "4.1"
  jupyterlab_max: "5"
  jupyterlab_check_max: "4.6"
  js_version: ${{ version | replace('rc', '-rc') | replace('a', '-alpha') | replace('b', '-beta') }}
  grep: ${{ "grep -iE " if unix else "findstr /r /c:" }}
  js_ext_test: |-
    jupyter labextension list  2>&1 | ${{ grep }}"@jupyrdf/jupyter-elk.*v${{ js_version | replace('.', '\\.') }}.*OK"

package:
  name: ipyelk
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/i/ipyelk/ipyelk-${{ version }}.tar.gz
  sha256: b14446bcb39492bc58beb8418471fe844978297b08fb58757df31aad05830ea5

build:
  number: 1
  noarch: python
  script:
    ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  host:
    - flit-core >=3.12,<4
    - pip
    - python ${{ python_min }}.*
  run:
    - ipywidgets >=8.0.1,<9
    - jsonschema >=4.18
    - networkx
    - pydantic >=2.12,<3
    - python >=${{ python_min }}
  run_constraints:
    - jupyterlab >=${{ jupyterlab_min }},<${{ jupyterlab_max }}

tests:
  - package_contents:
      strict: true
      files:
        - share/jupyter/labextensions/@jupyrdf/jupyter-elk/**
      site_packages:
        - ipyelk/**
        - ipyelk-${{ version }}.dist-info/**
  - python:
      imports:
        - ipyelk
        - ipyelk.diagram
        - ipyelk.elements
        - ipyelk.loaders
        - ipyelk.pipes
        - ipyelk.schema
        - ipyelk.tools
        - ipyelk.contrib.library
        - ipyelk.contrib.molds
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - requirements:
      run:
        - jupyterlab ${{ jupyterlab_min }}.*
        - pip
        - python ${{ python_min }}.*
    script:
      - jupyter labextension list
      - ${{ js_ext_test }}
  - requirements:
      run:
        - jupyterlab ${{ jupyterlab_check_max }}.*
        - pip
        - python ${{ python_check_max }}.*
    script:
      - jupyter labextension list
      - ${{ js_ext_test }}

about:
  summary: ELK widget for Jupyter
  license: BSD-3-Clause AND EPL-1.0 AND EPL-2.0
  license_file:
    - LICENSE.txt
    - COPYRIGHT.md
    - third-party/epl-v10.html
    - third-party/epl-v20.html
    - src/_d/share/jupyter/labextensions/@jupyrdf/jupyter-elk/static/third-party-licenses.json
  homepage: https://pypi.org/project/ipyelk
  repository: https://github.com/jupyrdf/ipyelk

extra:
  recipe-maintainers:
    - bollwyvl
    - dfreeman06
